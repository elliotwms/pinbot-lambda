name: Release
on:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.changelog.outputs.tag }}
      skipped: ${{ steps.changelog.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.github_token }}
          # the default angular preset doesn't recognise "!" in a commit header (e.g. "feat!:"), so breaking changes
          # were released as patches. conventionalcommits follows the Conventional Commits spec, which does
          preset: conventionalcommits
          skip-commit: "true"
          skip-on-empty: "false"
      - name: Create Release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          TAG: ${{ steps.changelog.outputs.tag }}
          NOTES: ${{ steps.changelog.outputs.clean_changelog }}
        run: gh release create "$TAG" --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA"
  deploy:
    name: Deploy
    needs: release
    if: ${{ needs.release.outputs.skipped == 'false' }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{ needs.release.outputs.tag }}
